# ==============================================================================
# FlatHydra -- Configuration dataset v2 (datasets_finaux, 2x RTX 3090)
# ==============================================================================
# Dérivée de flat_hydra_3090.yaml. Dataset v2 : train 5 259 035 lignes,
# 157 L1 / 5 777 L2, lignes synthétiques préfixées SYNTH- (ORPH, OVS, OVL, GEN).
#
# Stratégie de rééquilibrage — règle « doublons OU pondération » :
#   - synthetic_policy: drop_oversampled — retire les copies verbatim
#     SYNTH-OVS/OVL du train (ORPH et GEN sont conservés) ;
#   - class_weighting: inv_sqrt — poids 1/sqrt(n) sur les comptes RÉELS ;
#   - logit_adjustment_tau: 1.0 — logit-adjusted loss (Menon et al., 2021).
# normalize_text: true — normalisation designation/description au chargement.
# ==============================================================================

# --- Encoder ---
encoder: camembert-base
max_length: 256
freeze_encoder: false

# --- Architecture ---
project_embedding: true   # Linear(768 → 1536) sur last_hidden_state AVANT pooling
pooling: cls              # cls | mean | max | last
dropout: 0.2              # 0.2 selon le papier (≠ 0.3 dans HYDRA local/global/nested)

# --- Training ---
batch_size: 256           # 128 samples/GPU sur RTX 3090 24 GB (~56% VRAM = ~13.5 GB/GPU)
epochs: 10
lr: 3.5e-5
weight_decay: 0.01
warmup_ratio: 0.1
max_grad_norm: 1.0

# --- Early stopping ---
early_stopping_patience: 2
early_stopping_min_delta: 0.001

# --- Loss ---
use_focal: false          # CrossEntropy standard (fidélité au papier)
focal_gamma: 2.0          # ignoré si use_focal=false
level_weight_l1: 0.5      # poids relatif de la loss L1 (L2 = 1.0 implicitement)

# --- Rééquilibrage v2 (comptes réels, hors lignes SYNTH-) ---
class_weighting: inv_sqrt     # none | inv_sqrt | inv
logit_adjustment_tau: 1.0     # 0 = désactivé

# --- Data ---
num_workers: 4            # 5 CPUs alloués, 4 workers data loading, 1 réservé process principal
normalize_text: true                  # param de chargement (data_loader)
synthetic_policy: drop_oversampled    # param de chargement (data_loader)

# --- Logging ---
experiment_name: flat_hydra_v2

# --- Reproducibility ---
seed: 42

# --- Hardware ---
fp16: true
save_dir: models_v2/flat_hydra
