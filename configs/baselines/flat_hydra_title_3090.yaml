# ==============================================================================
# FlatHydra — Configuration Title-only (designation seule, 2× RTX 3090)
# ==============================================================================
# Dérivée de flat_hydra_3090.yaml avec :
#   - use_description: false  (designation seule)
#   - max_length: 128         (réduit : titres < 80 tokens)
#   - batch_size: 512         (256 × 2 — mesuré ~11 GB/GPU sur RTX 3090)
#     OOM à 1280 (640/GPU) : 23.21/23.56 GiB. DataParallel overhead GPU 0.
#   - lr: 4.9e-5              (3.5e-5 × √2, √k scaling depuis batch=256)
#   - save_dir: models/v1/flat_hydra_title
#   - experiment_name: flat_hydra_title

# --- Encoder ---
encoder: camembert-base
max_length: 128
freeze_encoder: false

# --- Architecture ---
project_embedding: true
pooling: cls
dropout: 0.2

# --- Training ---
batch_size: 512
epochs: 10
lr: 4.9e-5
weight_decay: 0.01
warmup_ratio: 0.1
max_grad_norm: 1.0

# --- Early stopping ---
early_stopping_patience: 2
early_stopping_min_delta: 0.001

# --- Loss ---
use_focal: false
focal_gamma: 2.0
level_weight_l1: 0.5

# --- Data ---
use_description: false
num_workers: 4

# --- Logging ---
experiment_name: flat_hydra_title

# --- Reproducibility ---
seed: 42

# --- Hardware ---
fp16: true
save_dir: models/v1/flat_hydra_title
