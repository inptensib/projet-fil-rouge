# ==============================================================================
# HYDRA -- Configuration Title-only + conditioning hiérarchique
# ==============================================================================
# Identique à hierarchy.yaml sauf :
#   - use_description: false         (designation seule)
#   - max_length: 128                (titles seuls tiennent en < 80 tokens)
#   - save_dir: models_title_hierarchy
#   - experiment_suffix: _title_hierarchy

# --- Encoder ---
encoder: camembert-base
max_length: 128
freeze_encoder: false

# --- Architecture ---
variant: local            # local | global | nested
num_levels: 2
hidden_dim: 256
dropout: 0.3
pooling: cls              # cls | mean | max | last
project_embedding: true

# --- Training ---
batch_size: 640
epochs: 10
lr: 1.12e-4
weight_decay: 0.01
warmup_ratio: 0.1
scheduler: linear
max_grad_norm: 1.0
gradient_accumulation_steps: 1

# --- Early stopping ---
early_stopping_patience: 2
early_stopping_min_delta: 0.001

# --- Multi-task loss ---
use_focal: true
focal_gamma: 2.0
level_weights:
  - 0.5                  # L1 weight (L2 is implicitly 1.0)

# --- Hierarchy (ACTIVÉ) ---
check_hierarchy: true
condition_l2_on_l1: true

# --- Data ---
use_description: false
num_workers: 4
pin_memory: true

# --- Logging ---
mlflow_tracking_uri: ../mlruns
experiment_suffix: "_title_hierarchy"

# --- Save ---
save_dir: models_title_hierarchy

# --- Reproducibility ---
seed: 42
deterministic: true

# --- Hardware ---
device: auto
fp16: true
