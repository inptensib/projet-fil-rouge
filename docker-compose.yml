# ==============================================================================
# Rakuten Classification -- Docker Compose
# ==============================================================================
# Usage:
#   docker compose run --rm --profile test test                 # Tests
#   docker compose run --rm --profile gpu train                 # HYDRA training
#   docker compose run --rm --profile baselines baseline-tfidf  # TF-IDF baseline
#
# Dataset : placer les splits JSONL dans dataset/ avant le training
#   (cf. scripts/download_dataset.py). Entraînement sur cluster : voir docs/PIPELINE.md.
# ==============================================================================

# --- Anchor YAML (not a service, ignored by Compose) ---
x-app: &app
  build:
    context: .
    dockerfile: Dockerfile
  volumes:
    - ./dataset:/app/dataset:ro
    - ./models:/app/models
  environment:
    HF_HOME: /app/.cache/huggingface
    PYTHONPATH: /app

services:

  # --------------------------------------------------------------------------
  # Tests (no GPU, no data)
  # --------------------------------------------------------------------------
  test:
    <<: *app
    command: pytest tests/ -v --tb=short
    profiles: ["test"]

  # --------------------------------------------------------------------------
  # HYDRA Training (single-GPU)
  # --------------------------------------------------------------------------
  train:
    <<: *app
    command: >
      python scripts/run_train.py
        --config configs/hydra/default.yaml
        --split-dir dataset/
        --n-samples 10000
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    profiles: ["gpu"]

  # --------------------------------------------------------------------------
  # Baselines (CPU, no GPU needed)
  # --------------------------------------------------------------------------
  baseline-tfidf:
    <<: *app
    command: >
      python -m rakuten.models.baselines.tfidf_pipeline
        --data_path dataset/train_split.jsonl
        --n_samples 10000
        --save_dir models/baseline_tfidf
    profiles: ["baselines"]

  baseline-word2vec:
    <<: *app
    command: >
      python -m rakuten.models.baselines.word2vec_pipeline
        --data_path dataset/train_split.jsonl
        --n_samples 10000
        --save_dir models/baseline_word2vec
    profiles: ["baselines"]

  baseline-bert:
    <<: *app
    command: >
      python -m rakuten.models.baselines.bert_flat_classifier
        --data_path dataset/train_split.jsonl
        --n_samples 10000
        --save_dir models/baseline_bert
    profiles: ["baselines"]
