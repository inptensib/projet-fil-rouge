# ==============================================================================
# FlatHydra CamemBERT — dataset v2 (fuite purgée), méthode NAÏVE
# ==============================================================================
# Identique à flat_hydra_3090.yaml (batch 256, le config du FlatHydra CamemBERT
# v1 qui a donné F1 L2 = 71,7 %) — SEULE différence : save_dir séparé pour ne
# pas écraser le modèle v1, et entraînement sur le dataset v2.
#
# « Naïve » = aucun kit de rééquilibrage (pas de normalize_text, pas de
# filtrage SYNTH-, pas de class weights). Objectif : isoler l'effet de la
# purge de fuite (seule la donnée change vs v1). Le kit v2 viendra ensuite.
# ==============================================================================

# --- Encoder ---
encoder: camembert-base
max_length: 256
freeze_encoder: false

# --- Architecture ---
project_embedding: true
pooling: cls
dropout: 0.2

# --- Training ---
batch_size: 256           # 128 samples/GPU sur RTX 3090 (~13.5 GB/GPU)
epochs: 10
lr: 3.5e-5
weight_decay: 0.01
warmup_ratio: 0.1
max_grad_norm: 1.0

# --- Early stopping ---
early_stopping_patience: 2
early_stopping_min_delta: 0.001

# --- Loss ---
use_focal: false
focal_gamma: 2.0
level_weight_l1: 0.5

# --- Data ---
num_workers: 2            # réduit (4→2) pour tenir dans 26 Go RAM sur 3090

# --- Logging ---
experiment_name: flat_hydra_v2

# --- Reproducibility ---
seed: 42

# --- Hardware ---
fp16: true
save_dir: models_v2/flat_hydra
