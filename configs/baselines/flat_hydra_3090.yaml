# ==============================================================================
# FlatHydra — Configuration full training (2× RTX 3090, dataset complet)
# ==============================================================================
# Dérivée de flat_hydra_full.yaml (P100). Seul batch_size change.
# batch_size=512 : 256 samples/GPU × ~70 MB/sample = ~18 GB/24 GB (75% VRAM).
# Note : batch=512 (256/GPU) → OOM (23.54/23.56 GiB). DataParallel overhead GPU 0 non-linéaire.
# ==============================================================================

# --- Encoder ---
encoder: camembert-base
max_length: 256
freeze_encoder: false

# --- Architecture ---
project_embedding: true   # Linear(768 → 1536) sur last_hidden_state AVANT pooling
pooling: cls              # cls | mean | max | last
dropout: 0.2              # 0.2 selon le papier (≠ 0.3 dans HYDRA local/global/nested)

# --- Training ---
batch_size: 256           # 128 samples/GPU sur RTX 3090 24 GB (~56% VRAM = ~13.5 GB/GPU)
                          # 512 → OOM : DataParallel overhead GPU 0 = 23.54/23.56 GiB (trop plein)
epochs: 10
lr: 3.5e-5                # inchangé : dans la plage standard fine-tuning CamemBERT
weight_decay: 0.01
warmup_ratio: 0.1
max_grad_norm: 1.0

# --- Early stopping ---
early_stopping_patience: 2
early_stopping_min_delta: 0.001

# --- Loss ---
use_focal: false          # CrossEntropy standard (fidélité au papier)
focal_gamma: 2.0          # ignoré si use_focal=false
level_weight_l1: 0.5      # poids relatif de la loss L1 (L2 = 1.0 implicitement)

# --- Data ---
num_workers: 4            # 5 CPUs alloués, 4 workers data loading, 1 réservé process principal

# --- Logging ---
experiment_name: flat_hydra

# --- Reproducibility ---
seed: 42

# --- Hardware ---
fp16: true
save_dir: models/v1/flat_hydra
