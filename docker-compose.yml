# ==============================================================================
# Rakuten Classification -- Docker Compose
# ==============================================================================
# Usage:
#   docker compose up mlflow                                    # MLflow UI :5000
#   docker compose run --rm --profile test test                 # Tests
#   docker compose run --rm --profile gpu train                 # HYDRA training (GPU)
#   docker compose run --rm --profile baselines baseline-tfidf  # TF-IDF baseline
#   docker compose run --rm --profile baselines flat-hydra-cpu  # FlatHydra CPU (N_SAMPLES=1000)
#   docker compose run --rm --profile gpu flat-hydra            # FlatHydra GPU complet
#
# Dataset : placer products.jsonl dans shared/dataset/ avant le training.
# Multi-GPU SLURM : ./03_distributed/scripts/launch_distributed.sh
# ==============================================================================

# --- Anchor YAML (not a service, ignored by Compose) ---
x-app: &app
  build:
    context: .
    dockerfile: Dockerfile
  volumes:
    - ./shared/dataset:/app/shared/dataset:ro
    - ./models:/app/models
  environment:
    HF_HOME: /app/.cache/huggingface
    PYTHONPATH: /app

services:

  # --------------------------------------------------------------------------
  # MLflow Tracking Server
  # --------------------------------------------------------------------------
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.12.1
    ports:
      - "5000:5000"
    volumes:
      - mlflow-data:/mlflow
    command: >
      mlflow server
        --backend-store-uri sqlite:///mlflow/mlflow.db
        --default-artifact-root /mlflow/artifacts
        --host 0.0.0.0
        --port 5000
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  # --------------------------------------------------------------------------
  # Tests (no GPU, no data, no MLflow)
  # --------------------------------------------------------------------------
  test:
    <<: *app
    command: pytest tests/ -v --tb=short
    profiles: ["test"]

  # --------------------------------------------------------------------------
  # HYDRA Training (single-GPU)
  # --------------------------------------------------------------------------
  train:
    <<: *app
    command: >
      python scripts/run_train.py
        --config 02_hydra/configs/default.yaml
        --data shared/dataset/products.jsonl
        --n-samples 10000
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    profiles: ["gpu"]

  # --------------------------------------------------------------------------
  # Baselines (CPU, no GPU needed)
  # --------------------------------------------------------------------------
  baseline-tfidf:
    <<: *app
    command: >
      python 01_baselines/src/tfidf_pipeline.py
        --data_path shared/dataset/products.jsonl
        --n_samples 10000
        --save_dir models/baseline_tfidf
    profiles: ["baselines"]

  baseline-word2vec:
    <<: *app
    command: >
      python 01_baselines/src/word2vec_pipeline.py
        --data_path shared/dataset/products.jsonl
        --n_samples 10000
        --save_dir models/baseline_word2vec
    profiles: ["baselines"]

  baseline-bert:
    <<: *app
    command: >
      python 01_baselines/src/bert_flat_classifier.py
        --data_path shared/dataset/products.jsonl
        --n_samples 10000
        --save_dir models/baseline_bert
    profiles: ["baselines"]

  # --------------------------------------------------------------------------
  # FlatHydra — Entraînement CPU local (vraies données, pas de GPU)
  # Contrôle via variables d'environnement :
  #   N_SAMPLES : nombre de samples (défaut: 1000)
  #   N_EPOCHS  : nombre d'epochs   (défaut: 2)
  #   BATCH     : batch size         (défaut: 16)
  #
  # Usage :
  #   docker compose run --rm --profile baselines flat-hydra-cpu
  #   N_SAMPLES=5000 N_EPOCHS=3 docker compose run --rm --profile baselines flat-hydra-cpu
  # --------------------------------------------------------------------------
  flat-hydra-cpu:
    <<: *app
    command: >
      python scripts/run_flat_hydra.py
        --data shared/dataset/products.jsonl
        --config 01_baselines/configs/flat_hydra.yaml
        --n-samples ${N_SAMPLES:-1000}
        --epochs ${N_EPOCHS:-2}
        --batch-size ${BATCH:-16}
        --save-dir models/flat_hydra_cpu
    environment:
      HF_HOME: /app/.cache/huggingface
      PYTHONPATH: /app
      CUDA_VISIBLE_DEVICES: ""
    profiles: ["baselines"]

  # --------------------------------------------------------------------------
  # FlatHydra — Training complet (GPU requis)
  # Usage : docker compose run --rm --profile gpu flat-hydra
  # --------------------------------------------------------------------------
  flat-hydra:
    <<: *app
    command: >
      python scripts/run_flat_hydra.py
        --data shared/dataset/products.jsonl
        --config 01_baselines/configs/flat_hydra.yaml
        --n-samples 10000
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    profiles: ["gpu"]

volumes:
  mlflow-data:
