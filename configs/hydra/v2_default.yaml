# ==============================================================================
# HYDRA -- Configuration dataset v2 (datasets_finaux)
# ==============================================================================
# Dataset v2 : train 5 259 035 lignes, 157 L1 / 5 777 L2. Les lignes
# synthétiques portent un productid préfixé SYNTH- (ORPH 2 900 templates
# classes orphelines, OVS 119 510 copies verbatim, OVL 187, GEN 7 044
# templates ancrés).
#
# Stratégie de rééquilibrage — règle « doublons OU pondération » :
#   - synthetic_policy: drop_oversampled — retire les copies verbatim
#     SYNTH-OVS/OVL du train (ORPH et GEN sont conservés) ;
#   - class_weighting: inv_sqrt — poids 1/sqrt(n) sur les comptes RÉELS ;
#   - logit_adjustment_tau: 1.0 — logit-adjusted loss (Menon et al., 2021).
# normalize_text: true — normalisation designation/description au chargement.
# Les hyperparamètres d'entraînement sont identiques à default.yaml.
# ==============================================================================

# --- Encoder ---
encoder: camembert-base
max_length: 256
freeze_encoder: false

# --- Architecture ---
variant: local            # local | global | nested
hidden_dim: 256
dropout: 0.3
pooling: cls              # cls | mean | max | last
project_embedding: true

# --- Training ---
batch_size: 64
epochs: 10
lr: 3.5e-5
weight_decay: 0.01
warmup_ratio: 0.1
max_grad_norm: 1.0
gradient_accumulation_steps: 1

# --- Early stopping ---
early_stopping_patience: 2
early_stopping_min_delta: 0.001

# --- Multi-task loss ---
use_focal: false
focal_gamma: 2.0
level_weights:
  - 0.5                  # L1 weight (L2 is implicitly 1.0)

# --- Rééquilibrage v2 (comptes réels, hors lignes SYNTH-) ---
class_weighting: inv_sqrt     # none | inv_sqrt | inv
logit_adjustment_tau: 1.0     # 0 = désactivé

# --- Hierarchy ---
check_hierarchy: false
condition_l2_on_l1: false     # Masquer L2 avec le vrai L1 pendant le training (teacher forcing)

# --- Data ---
num_workers: 4
pin_memory: true
normalize_text: true                  # param de chargement (data_loader)
synthetic_policy: drop_oversampled    # param de chargement (data_loader)

# --- Logging ---
experiment_suffix: "_v2"

# --- Reproducibility ---
seed: 42

# --- Hardware ---
fp16: true
save_dir: models/v2
