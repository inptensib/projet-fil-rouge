# ==============================================================================
# HYDRA -- Default Configuration
# ==============================================================================

# --- Encoder ---
encoder: camembert-base
max_length: 128
freeze_encoder: false

# --- Architecture ---
variant: local            # local | global | nested
num_levels: 2
hidden_dim: 256
dropout: 0.3

# --- Training ---
batch_size: 128
epochs: 20
lr: 3.5e-5
weight_decay: 0.01
warmup_ratio: 0.1
scheduler: linear         # linear | cosine
gradient_clip: 1.0

# --- Multi-task loss ---
loss: cross_entropy       # cross_entropy | focal
level_weights:
  - 0.4                  # L1 weight
  - 0.6                  # L2 weight

# --- Data ---
data_dir: ../shared/dataset
train_file: train.csv
val_file: val.csv
test_file: test.csv
num_workers: 4
pin_memory: true

# --- Logging ---
mlflow_tracking_uri: ../mlruns
experiment_name: hydra
log_every_n_steps: 50

# --- Reproducibility ---
seed: 42
deterministic: true

# --- Hardware ---
device: auto              # auto | cpu | cuda
fp16: true
ddp: false
