# ==============================================================================
# FlatHydra mBERT — dataset v2 (fuite purgée), méthode NAÏVE
# ==============================================================================
# Complète la matrice 2×2 {CamemBERT, mBERT} × {v1, v2}.
# batch_size 96 = IDENTIQUE au mBERT v1 (job 854034) → seule la donnée change,
# comparaison v1↔v2 propre pour mBERT.
# save_dir séparé pour ne pas écraser le mBERT v1 (models/flat_hydra_mbert).
# ==============================================================================

# --- Encoder ---
encoder: bert-base-multilingual-cased
max_length: 256
freeze_encoder: false

# --- Architecture ---
project_embedding: true
pooling: cls
dropout: 0.2

# --- Training ---
batch_size: 96            # = mBERT v1 (854034) ; sur 2 P100 → 48/GPU
epochs: 10
lr: 3.5e-5
weight_decay: 0.01
warmup_ratio: 0.1
max_grad_norm: 1.0

# --- Early stopping ---
early_stopping_patience: 2
early_stopping_min_delta: 0.001

# --- Loss ---
use_focal: false
focal_gamma: 2.0
level_weight_l1: 0.5

# --- Data ---
num_workers: 2            # réduit pour tenir dans la RAM disponible

# --- Logging ---
experiment_name: flat_hydra_v2

# --- Reproducibility ---
seed: 42

# --- Hardware ---
fp16: true
save_dir: models_v2/flat_hydra_mbert
