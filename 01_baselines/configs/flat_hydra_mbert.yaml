# ==============================================================================
# FlatHydra — Configuration mBERT (bert-base-multilingual-cased), 2× P100
# ==============================================================================
# Dérivée de flat_hydra_3090.yaml. Changements :
#   - encoder : mBERT (179M params vs 111M CamemBERT)
#   - batch_size : 128 (64/GPU × 2 P100 16 GB — mBERT plus lourd que CamemBERT)
#   - save_dir : models/flat_hydra_mbert
# ==============================================================================

# --- Encoder ---
encoder: bert-base-multilingual-cased
max_length: 256
freeze_encoder: false

# --- Architecture ---
project_embedding: true
pooling: cls
dropout: 0.2

# --- Training ---
batch_size: 128           # 64 samples/GPU sur P100 16 GB
epochs: 10
lr: 3.5e-5
weight_decay: 0.01
warmup_ratio: 0.1
max_grad_norm: 1.0

# --- Early stopping ---
early_stopping_patience: 2
early_stopping_min_delta: 0.001

# --- Loss ---
use_focal: false
focal_gamma: 2.0
level_weight_l1: 0.5

# --- Data ---
num_workers: 4

# --- Logging ---
experiment_name: flat_hydra

# --- Reproducibility ---
seed: 42

# --- Hardware ---
fp16: true
save_dir: models/flat_hydra_mbert
