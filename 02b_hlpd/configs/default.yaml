# HLPD -- Default Configuration
# Reference: Torba, Laclau et al., ECIR 2025

# ---- Data ----
data:
  file_path: "data/rakuten_products.jsonl"
  n_samples: 50000
  test_size: 0.2
  val_ratio: 0.125
  max_length: 128
  seed: 42

# ---- Text Encoder ----
encoder:
  # Options: "camembert-base", "camembert/camembert-large",
  #          "google/mt5-small", "google/mt5-base"
  name: "camembert-base"
  type: "camembert"  # "camembert" or "t5"
  freeze: false

# ---- Model ----
model:
  d_model: 768
  num_decoder_layers: 3
  num_heads: 8
  d_ff: 2048
  dropout: 0.1

# ---- Label Encoder ----
label_encoder:
  num_heads: 4
  max_len: 64
  dropout: 0.1

# ---- Loss ----
loss:
  type: "zlpr"  # "zlpr" or "bce"
  bce_pos_weight: null

# ---- Training ----
training:
  batch_size: 32
  num_epochs: 20
  learning_rate: 2.0e-5
  weight_decay: 0.01
  warmup_ratio: 0.1
  max_grad_norm: 1.0
  fp16: true
  gradient_accumulation_steps: 1

# ---- Evaluation ----
evaluation:
  eval_every_n_steps: 500
  threshold: 0.0
  early_stopping_patience: 5

# ---- Logging ----
logging:
  output_dir: "outputs/hlpd"
  log_every_n_steps: 50
  save_best_model: true
  wandb_project: null
